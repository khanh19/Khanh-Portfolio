    <meta name="theme-color" content="#cfe0f2" />
    <!-- Set the theme before first paint to avoid a flash: light by default,
         dark only if the visitor chose it with the toggle. -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem("kp-theme"); } catch (e) {}
        if (theme !== "dark") theme = "light";
        document.documentElement.dataset.theme = theme;
        // Keep in sync with THEME_COLORS in src/lib/theme.ts.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#141a34" : "#cfe0f2");
      })();
    </script>
