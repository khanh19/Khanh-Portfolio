    />
    <meta name="theme-color" content="#cfe0f2" />
    <!-- Set the theme before first paint (stored choice, else the OS setting) to avoid a flash. -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem("kp-theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        // Keep in sync with THEME_COLORS in src/lib/theme.ts.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#141a34" : "#cfe0f2");
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Khanh Pham — Software Engineer" />
    <meta
      property="og:description"
      content="Backend, platform, and cloud engineer. Builder of Lô!, MediCall, and FoodieOnRoad."
    />
